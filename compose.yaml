services:
  app:
    build: .
    container_name: monitoring-demo
    ports:
      - "8080:8080"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [monitoring]
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    hostname: netdata-docker
    ports:
      - "19999:19999"
    cap_add: [SYS_PTRACE]
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks: [monitoring]
networks:
  monitoring:
    driver: bridge
volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
